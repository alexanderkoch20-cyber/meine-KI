brand_identity:
  brand_name: Rulenine
  owner: 'Der Owner besitzt die Marke persoenlich. Aktuelle Unternehmensform: Einzelunternehmen.
    Eine spaetere GmbH ist vorgesehen, sobald Rulenine entsprechend laeuft und die
    wirtschaftlichen/organisatorischen Voraussetzungen gegeben sind. WICHTIG: Die
    GmbH existiert aktuell NICHT und darf von keinem Agenten als bestehende Rechtsform
    dargestellt werden.'
  founders: NOT_PROVIDED
  history: NOT_PROVIDED
  mission: Rulenine verbindet Premium-Qualitaet, minimalistisches Design, Streetwear
    und sportliche Elemente zu hochwertiger Kleidung fuer Menschen, die ihren eigenen
    Stil und ihren eigenen Weg leben. (Arbeitsversion)
  vision: Rulenine soll sich von einer jungen Premium-Streetwear-Marke zu einer international
    etablierten Fashion- und Lifestyle-Marke entwickeln, die Fashion, Streetwear,
    Sport und Lifestyle miteinander verbindet und weltweit fuer Qualitaet, minimalistisches
    Design, Freiheit und einen eigenen Stil steht. (Arbeitsversion)
  values:
  - Qualitaet
  - Ehrlichkeit
  - Freiheit
  - Mut
  - Perfektion
  - Premium
  long_term_goals:
  - Start in Deutschland; nach erfolgreichem Aufbau schrittweise Expansion in weitere
    europaeische Maerkte und langfristig international. Reihenfolge und Zeitpunkt
    entscheidet ausschliesslich der Owner.
  - Spaetere Gruendung einer GmbH, sobald die Voraussetzungen gegeben sind (existiert
    aktuell NICHT).
