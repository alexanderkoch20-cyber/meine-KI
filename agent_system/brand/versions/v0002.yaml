no_gos:
  statements:
  - erfundene Produktversprechen
  - falsche Angaben zu Material, Qualitaet oder Herstellung
  - irrefuehrende Rabatte
  - unbelegbare Superlative
  - erfundene oder irrefuehrende Knappheit (z.B. eine Restmengen-Angabe, die nicht
    stimmt)
  - Darstellung einer GmbH als bereits bestehende Rechtsform (existiert aktuell nicht)
  - Arbeitsnamen (Core, Motion, Performance) oder optionale Produktvarianten als feststehend
    darstellen
  topics:
  - politische oder religioese Kampagnen als Bestandteil der Marke
  - beleidigende oder diskriminierende Kommunikation
  designs:
  - billige oder unserioese Darstellung
  - kopierte Designs
  marketing_methods:
  - uebertriebene Protz-/Luxuskommunikation
  - kuenstlicher Hype
  - aggressive Verkaufssprache
  - Fake-Kommentare
  - gekaufte Bewertungen
  - Provokation ausschliesslich fuer Reichweite
  - erfundene oder irrefuehrende Knappheit
  actions:
  - fremde Inhalte ohne entsprechende Rechte verwenden
  - Personen ohne erforderliche Zustimmung veroeffentlichen
  - 'Agenten duerfen NICHT selbststaendig: posten, Produkte veroeffentlichen, Preise
    aendern, Drops starten, Werbebudget ausgeben, Kunden kontaktieren, Brand-Regeln
    veraendern, neue Produktlinien beschliessen, limitierte Stueckzahlen festlegen
    - Ausfuehrung nur nach Owner-/Governance-Freigabe'
  - 'Agenten duerfen: analysieren, recherchieren, Entwuerfe erstellen, Vorschlaege
    machen, Risiken melden, Entscheidungen zur Owner-Freigabe vorbereiten'
