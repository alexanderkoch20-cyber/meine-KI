# Modell-Stufen -> konkrete Modell-IDs.
# Agenten referenzieren nur die STUFE (opus/sonnet/haiku), nie die ID direkt.
# So kann ein Modellwechsel an genau einer Stelle erfolgen.

# Welcher LLM-Client genutzt wird:
#   mock      = komplett offline, deterministisch, keine Kosten (Standard)
#   anthropic = echte Claude-API (kostenpflichtig) - erst nach Freigabe!
provider: mock

tiers:
  opus:
    model_id: claude-opus-5-5
    max_tokens: 4096
    temperature: 0.3
  sonnet:
    model_id: claude-sonnet-5
    max_tokens: 4096
    temperature: 0.7
  haiku:
    model_id: claude-haiku-4-5-20251001
    max_tokens: 1024
    temperature: 0.0

# Schutz gegen ungewollte Kosten, sobald ein echter Provider aktiv ist.
budget:
  max_llm_calls_per_job: 40
